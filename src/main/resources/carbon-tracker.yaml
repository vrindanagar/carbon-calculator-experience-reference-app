openapi: 3.0.3
info:
  title: Carbon Calculator Experience API
  description: >
    OpenAPI specifications for the Carbon Calculator Experience API. This API
    allows Issuers to enroll their customers to the Carbon Calculator Experience
    platform so that they can get a carbon footprint for their transactions and
    provides them with an option to donate towards tree plantations


    In addition, this API also allows Issuers to retrieve carbon footprint
    aggregate data for their customers.
      <br/>
    ---

    * **All requests must be signed using OAuth 1.0a. Refer to the [Access
    Mastercard
    APIs](https://developer.mastercard.com/platform/documentation/using-oauth-1a-to-access-mastercard-apis/).**

    ---

    * **The Issuer must provide their user's card details and email address
    while enrollment. These details must be encrypted before entering transit.
    Refer to the [Payload
    Encryption](https://developer.mastercard.com/platform/documentation/security-and-authentication/securing-sensitive-data-using-payload-encryption/).**

    ---
  contact:
    name: API Support
    url: 'https://developer.mastercard.com/support'
    email: apisupport@mastercard.com
  version: 1.0.0
servers:
  - url: 'https://api.mastercard.com/cts'
    description: Production
  - url: 'https://sandbox.api.mastercard.com/cts'
    description: Sandbox
tags:
  - name: Issuer
    description: Contains APIs which will be consumed by the Issuer's backend system.
paths:
  /issuers:
    get:
      tags:
        - Issuer
      summary: Fetches the Issuer details.
      description: >-
        Allows for the fetching of the details of the Issuer onboarded onto the Carbon Calculator
        Experience. This API returns the Issuer's available details like a supported account range, currency code, and country code along with the color theme.
      operationId: getIssuer
      responses:
        '200':
          $ref: '#/components/responses/IssuerProfileDetails'
        '401':
          $ref: '#/components/responses/IssuerUnauthorisedError'
        '404':
          $ref: '#/components/responses/IssuerNotFoundError'
    put:
      tags:
        - Issuer
      summary: >-
        Allows Issuer to update the Issuer details to the Carbon Calculator
        Experience platform.
      description: >-
        Allows a registered Issuer to update the configuration details to the
        Carbon Calculator Experience API.
      operationId: updateIssuer
      requestBody:
        $ref: '#/components/requestBodies/IssuerConfiguration'
      responses:
        '200':
          $ref: '#/components/responses/IssuerProfile'
        '400':
          $ref: '#/components/responses/UpdateIssuerBadRequestError'
        '401':
          $ref: '#/components/responses/UpdateIssuerUnauthorisedError'
        '404':
          $ref: '#/components/responses/IssuerNotFoundError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeError'
  /issuers/users:
    post:
      tags:
        - Issuer
      summary: >-
        Allows Issuer to enroll cardholders to the Carbon Calculator
        Experience platform.
      description: |
        Used to enroll users for the Carbon Calculator Experience API so that
        they can track the carbon usage for their transactions and provides
        them with an option to donate towards tree plantation.

        **Note-**
        * If the issuer has opted for the Donation feature then the fields - *name, billing address, email, locale, cardholder name, card number, card base currency and card expiry date* fields are **mandatory** in the payload.
        * This endpoint uses the Mastercard payload
          encryption. Refer to the **[Payload
          Encryption](https://developer.mastercard.com/platform/documentation/security-and-authentication/securing-sensitive-data-using-payload-encryption/#mastercard-encryption)**
          page for implementation details.
      operationId: userRegistration
      x-mastercard-api-encrypted: true
      requestBody:
        $ref: '#/components/requestBodies/UserProfile'
      responses:
        '200':
          $ref: '#/components/responses/UserReference'
        '400':
          $ref: '#/components/responses/UserEnrolmentBadRequestError'
        '401':
          $ref: '#/components/responses/UserEnrolmentUnauthorisedError'
        '404':
          $ref: '#/components/responses/IssuerNotFoundError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeError'

  /issuers/users/{userid}:
    put:
      tags:
        - Issuer
      summary: Allows issuer to update enrolled user information onto Carbon Calculator Experience Service.
      description: Used to update the user's information for Carbon Calculator Experience.
      operationId: updateUser
      parameters:
        - $ref: '#/components/parameters/UserID'
      x-mastercard-api-encrypted: true
      requestBody:
        $ref: '#/components/requestBodies/UpdateUserProfile'
      responses:
        "200":
          $ref: '#/components/responses/UpdateUserReference'
        "400":
          $ref: '#/components/responses/UserEnrolmentBadRequestError'
        "401":
          $ref: '#/components/responses/UpdateUserUnauthorisedError'
        "404":
          $ref: '#/components/responses/IssuerNotFoundError'
        "415":
          $ref: '#/components/responses/UnsupportedMediaTypeError'
    delete:
      tags:
        - Issuer
      summary: delete a user
      description:
        Allows a registered Service Provider to delete user.
        Payment cards associated with the user will also be deleted.
        On a successful response from the Server, the Service Provider should remove all the requested users and associated payment
        cards from the system.
        Data deletion will be initiated immediately upon receipt of a request from the Service Provider.
      operationId: DeleteUserAndPaymentCards
      parameters:
        - $ref: '#/components/parameters/UserID'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        "400":
          $ref: '#/components/responses/DeleteUserByIdBadRequestError'
        "401":
          $ref: '#/components/responses/DeleteUserByIdUnauthorisedError'
        "404":
          $ref: '#/components/responses/DeleteUserByIdNotFoundError'
  '/issuers/users/{userid}/dashboards':
    get:
      tags:
        - Issuer
      summary: >-
        Used to retrieve the short-lived URL of a user's dashboard to view their carbon footprints and contributions to Priceless Planet.
      description: >-
        It allows issuers to retrieve a short-lived URL for an enrolled user. An Issuer needs to load this URL within their application so that the user can view the dashboard in their preferred language. Currently, four languages are supported, including English, Spanish (Latin America), Swedish, and Polish.
      operationId: getAuthToken
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          $ref: '#/components/responses/Dashboard'
        '400':
          $ref: '#/components/responses/DashboardBadRequestError'
        '401':
          $ref: '#/components/responses/DashboardsUnauthorisedError'
        '404':
          $ref: '#/components/responses/DashboardNotFoundError'
  /issuers/users/{userid}/aggregate-carbon-scores:
    get:
      tags:
        - Issuer
      summary: >-
        Fetch aggregate carbon score for a single or multiple payment cards. The aggregate can be requested monthly.
      description: >-
        Allows Issuers to retrieve an aggregate carbon score for payment cards and aggregates the same on monthly basis.
      operationId: getAggregateCarbonScore
      parameters:
        - $ref: '#/components/parameters/UserID'
      responses:
        '200':
          $ref: '#/components/responses/AggregateCarbonScore'
        '400':
          $ref: '#/components/responses/AggregateCarbonScoreBadRequestError'
        '401':
          $ref: '#/components/responses/AggregateCarbonScoreUnauthorisedError'
        '404':
          $ref: '#/components/responses/AggregateCarbonScoreNotFoundError'
  /issuers/users/{userid}/payment-cards:
    post:
      tags:
        - Issuer
      summary: Batch Registration of Payment Cards
      description: >-
        Allows a registered Service Provider to add a list of new Payment Cards **(at most maximum of 10 payment cards)**
        to its profile. This endpoint uses [Mastercard payload
        encryption](https://developer.mastercard.com/platform/documentation/security-and-authentication/securing-sensitive-data-using-payload-encryption/#mastercard-encryption). Refer to the [Payload
        Encryption](https://developer.mastercard.com/platform/documentation/security-and-authentication/securing-sensitive-data-using-payload-encryption/)
        section for implementation details.
      operationId: batchRegisterPaymentCards
      parameters:
        - $ref: '#/components/parameters/UserID'
      x-mastercard-api-encrypted: true
      requestBody:
        $ref: '#/components/requestBodies/PaymentCards'
      responses:
        '200':
          $ref: '#/components/responses/PaymentCardEnrolments'
        '400':
          $ref: '#/components/responses/PaymentCardEnrolmentsBadRequestError'
        '403':
          $ref: '#/components/responses/ServiceProviderICAValidationError'
        '404':
          $ref: '#/components/responses/IssuerNotFoundError'
  /issuers/user-deletions:
    post:
      tags:
        - Issuer
      summary: Delete one or more users.
      description: >-
        Allows a registered Service Provider to delete one or more
                users. Payment cards associated with the user will also be
                deleted. On a successful response from the Server, the Service         Provider should remove all the requested users and associated payment cards from the system.
      operationId: deleteUsers
      requestBody:
        $ref: '#/components/requestBodies/UserIDs'
      responses:
        '202':
          $ref: '#/components/responses/UserIDs'
        '400':
          $ref: '#/components/responses/DeleteUserBadRequestError'
        '401':
          $ref: '#/components/responses/DeleteUserUnauthorisedError'
        '404':
          $ref: '#/components/responses/DeleteUserNotFoundError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeError'
  /issuers/payment-cards/{payment_card_id}:
    delete:
      tags:
        - Issuer
      summary: Delete payment card.
      description:
        Allows a registered Service Provider to delete single Payment Card at a time.
        Any data associated with a requested paymentCardId
        will also be deleted permanently.
        On the successful response from the server, a Service Provider should remove all
        the requested paymentCardIds from the system.
        Once a request has been received from a Service Provider, data deletion
        will happen immediately.
      operationId: deletePaymentCard
      parameters:
        - $ref: '#/components/parameters/PaymentCardId'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/PaymentCardDeletionsBadRequestError'
        '404':
          $ref: '#/components/responses/PaymentCardByIdNotFoundError'

components:
  headers:
    Location:
      description: The URL to check on status of resource
      schema:
        type: string
  requestBodies:
    PaymentCards:
      required: true
      description: List of payment cards to be enroled.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/PaymentCard'
            minItems: 1
            maxItems: 10
            example:
              - fpan: '5455029300268351'
                cardBaseCurrency: EUR
                cardholderName: "John Doe"
                expiryInfo: {
                  "month": "10",
                  "year": "2024"
                }
                billingAddress: {
                  "countryCode": "Paris",
                  "locality": "Rly Station",
                  "postalCode": "11746",
                  "state": "Europe",
                  "city": "Paris",
                  "line1": "12 Mayfair Street",
                  "line2": "Main Road",
                  "line3": "Snake Hill Ave",
                  "type": "work"
                }
                defaultPaymentMethod: N
              - fpan: '5455023979760762'
                cardBaseCurrency: USD

                cardholderName: "JK Ken"
                expiryInfo: {
                  "month": "11",
                  "year": "2027"
                }
                billingAddress: {
                  "countryCode": "USA",
                  "locality": "Rly Station",
                  "postalCode": "11746",
                  "state": "New York",
                  "city": "Brooklyn",
                  "line1": "83 Mayfair Street",
                  "line2": "Main Road",
                  "line3": "Snake Hill Ave",
                  "type": "work"
                }
                defaultPaymentMethod: Y
              - fpan: '5455023979762834'
                cardBaseCurrency: USD


                cardholderName: "JK Ken"
                expiryInfo: {
                  "month": "10",
                  "year": "2024"
                }
                billingAddress: {
                  "countryCode": "USA",
                  "locality": "Rly Station",
                  "postalCode": "11746",
                  "state": "New York",
                  "city": "Brooklyn",
                  "line1": "83 Mayfair Street",
                  "line2": "Main Road",
                  "line3": "Snake Hill Ave",
                  "type": "work"
                }
                defaultPaymentMethod: N
              - fpan: '5455023979762824'
                cardBaseCurrency: USD
                cardholderName: "JK Ken"
                expiryInfo: {
                  "month": "10",
                  "year": "2024"
                }
                billingAddress: {
                  "countryCode": "USA",
                  "locality": "Rly Station",
                  "postalCode": "11746",
                  "state": "New York",
                  "city": "Brooklyn",
                  "line1": "83 Mayfair Street",
                  "line2": "Main Road",
                  "line3": "Snake Hill Ave",
                  "type": "work"
                }
                defaultPaymentMethod: N
    PaymentCardsEncryptedPayload:
      description: User's Personal and Card information needs to be registered to the Carbon Calculator Experience API. This endpoint uses Mastercard payload encryption. Please refer to the **[Payload Encryption](https://mstr.cd/2UPfda0)** page for implementation details.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EncryptedPayload'
    UserProfile:
      description:
        User's Personal and Card information needs to be registered to the
        Carbon Calculator Experience API.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserProfile'
    IssuerConfiguration:
      description: >-
        Configuration details for Issuer which need to be updated. It should
        contain only those parameters which you want to update.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IssuerConfiguration'
    UserIDs:
      description: List of user ids
      required: true
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/UserID'
            minItems: 1
            maxItems: 500
          examples:
            UserIDs:
              $ref: '#/components/examples/UserIDs'

    UpdateUserProfile:
      description: >-
        The request object for updating a enrolled user onto Carbon Calculator Experience Service. This endpoint uses the Mastercard payload
        encryption. Refer to the **[Payload
        Encryption](https://developer.mastercard.com/platform/documentation/security-and-authentication/securing-sensitive-data-using-payload-encryption/#mastercard-encryption)**
        page for implementation details.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateUserProfile'
  schemas:
    PaymentCard:
      title: PaymentCard
      type: object
      description: >-
        The request object for registering a new Payment Card. This object will
        be encrypted before sending it to the server.
      required:
        - fpan
        - cardBaseCurrency
        - cardholderName
        - expiryInfo
        - billingAddress
      properties:
        fpan:
          type: string
          minLength: 16
          maxLength: 16
          pattern: '^\d{16}$'
          description: Original payment card number in full.
          example: '5344035171229750'
        cardBaseCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        cardholderName:
          type: string
          description: Name of the card-holder. (format- First Name Last Name)
          minLength: 1
          maxLength: 100
          example: John Doe
        defaultPaymentMethod:
          type: string
          enum:
            - 'Y'
            - 'N'
          default: 'N'
          description: 'Indicates if this payment method is the default.'
          example: 'N'
        expiryInfo:
          $ref: '#/components/schemas/CardExpiry'
        billingAddress:
          $ref: '#/components/schemas/Address'
      example:
        fpan: '5344035171229750'
        cardBaseCurrency: EUR

    PaymentCardId:
      type: string
      minLength: 36
      maxLength: 36
      pattern: ^[0-9A-Fa-f\-]{36}
      x-pattern-message: 'Provided paymentcardId is not valid, Please check and provide valid Unique Id.'
      description: Unique identifier for a payment card.
      example: 'c5d88571-ac15-465a-a0d8-1ad1327b9a06'
    PaymentCardEnrolments:
      title: PaymentCardEnrolments
      type: array
      minItems: 1
      maxItems: 10
      description: >-
        List of payment card enrolments corresponding to each of the payment
        cards. This information should be used to identify the success and
        failure enrolments and take appropriate next steps.
      items:
        $ref: '#/components/schemas/PaymentCardEnrolment'
    PaymentCardEnrolment:
      title: PaymentCardEnrolment
      type: object
      description: The response object which contains Payment Card information.
      properties:

        last4fpan:
          type: string
          minLength: 4
          maxLength: 4
          pattern: '^\d{4}'
          description: >-
            Last 4 digits of a payment card number will be present only if the
            card number in the request is valid.
          example: '8351'
        status:
          type: string
          minLength: 6
          maxLength: 7
          description: >-
            Status of a Payment Card on the server. Possible values are ACTIVE &
            DELETED.
          example: ACTIVE
        paymentCardId:
          $ref: "#/components/schemas/PaymentCardId"
        defaultPaymentMethod:
          type: string
          minLength: 1
          maxLength: 1
          enum:
            - 'Y'
            - 'N'
          default: 'N'
          description: 'Indicates if this payment method is the default.'
          example: 'N'
        errorCode:
          title: errorCode
          type: string
          minLength: 10
          maxLength: 30
          example: INVALID_FPAN
    IssuerProfileDetails:
      title: IssuerProfileDetails
      type: object
      description: Information about an Issuer as available on the server.
      required:
        - clientId
        - supportedAccountRange
        - status
        - email
        - currencyCode
        - countryCode
        - countryName
        - termsAndConditionURL
        - privacyNoticeURL
        - optOutURL
        - preferredTheme
      properties:
        clientId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[\w\d\-\_]{1,200}'
          description: Unique Issuer identifier from the Mastercard Developers.
          example: fjl2fxzsYl1OpvxkBItC9nVw1PSQc_b-eQMcmQFg011ab4b5
        customerId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[\w\d]{1,200}'
          description: >-
            Unique Issuer identifier assigned by Mastercard which remains the same
            across all Mastercard systems.
          example: customerid1
        supportedAccountRange:
          type: string
          pattern: '^[0-9]{4,8}(,[0-9]{4,8})*$'
          description: >-
            Comma separated account range must be between 4 and 8 supported by
            an Issuer.
          example: '534403,518145,518152,5403,5424'
        status:
          type: string
          minLength: 6
          maxLength: 9
          description: >-
            Status of an Issuer on the server. Possible values are Active and
            Suspended.
          example: ACTIVE
        email:
          type: string
          minLength: 1
          maxLength: 100
          description: Issuers email address
          example: xyz@abc.com
        currencyCode:
          $ref: '#/components/schemas/CurrencyCode'
        countryCode:
          title: countryCode
          type: string
          description: >-
            DE 19 (Acquiring Institution Country Code) is the code of the
            country where the acquiring institution is located.
          maxLength: 3
          minLength: 3
          example: USA
        countryName:
          $ref: '#/components/schemas/CountryName'
        privacyNoticeURL:
          type: string
          description: Privacy Notice URL.
          example: 'https://www.issuer.privacy-policy-url.html'
        termsAndConditionURL:
          type: string
          description: Terms and conditions URL for the given user.
          example: 'https://www.issuer.term-and-conditions.html'
        optOutURL:
          type: string
          description: OPT out URL for the given user.
          example: 'https://www.issuer.opt-out-url.html'
        preferredTheme:
          $ref: '#/components/schemas/PreferredTheme'
    UserProfile:
      title: UserProfile
      type: object
      description: >-
        The request object for enrolling a new user to Carbon Calculator
        Experience API.
      required:
        - cardNumber
        - email
        - expiryInfo
        - cardBaseCurrency
        - cardholderName
      properties:
        email:
          $ref: '#/components/schemas/Email'
        name:
          $ref: '#/components/schemas/UserName'
        cardholderName:
          type: string
          description: Name of the card-holder. (format- First Name Last Name)
          minLength: 1
          maxLength: 100
          example: John Doe
        cardNumber:
          $ref: '#/components/schemas/CardNumber'
        cardBaseCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        expiryInfo:
          $ref: '#/components/schemas/CardExpiry'
        billingAddress:
          $ref: '#/components/schemas/Address'
        locale:
          type: string
          description: User locale which is registered with Issuer.
          minLength: 1
          maxLength: 100
          example: en-US
    CurrencyCode:
      title: currencyCode
      type: string
      description: Currency code as per ISO 4217
      pattern: '^[A-Za-z]{3}$'
      example: EUR
    CardExpiry:
      type: object
      properties:
        month:
          type: string
          example: '10'
          description: Denotes a month by when the card will be expired.
          pattern: '^[0-9]{2}$'
        year:
          type: string
          description: Denotes a year by when the card will be expired.
          example: '2024'
          pattern: '^[0-9]{4}$'
      title: CardExpiry
    CardNumber:
      type: string
      pattern: '^\d{16}$'
      description: Original payment card number in full.
      example: '5344035171224363'
    Address:
      type: object
      required:
        - countryCode
        - type
      properties:
        countryCode:
          description: Denotes three-character country code.
          type: string
          example: USA
          minLength: 3
          maxLength: 3
        locality:
          description: Neighborhood.
          type: string
          minLength: 3
          maxLength: 30
          example: Rly Station
        postalCode:
          description: <p> The postal code in the address is the ZIP code or equivalent and can be an alphanumeric value including whitespace (for example, PE7 8FT). <br><b> Note - Special characters and only whitespace characters are not allowed. </b></p>
          type: string
          example: '11746'
          maxLength: 12
        state:
          type: string
          description: The state or region or province to which the address belongs.
          example: New York
          minLength: 3
          maxLength: 20
        city:
          type: string
          description: City.
          example: Brooklyn
          minLength: 3
          maxLength: 20
        line1:
          type: string
          description: Street Address line1.
          minLength: 3
          maxLength: 20
          example: 83 Mayfair Street
        line2:
          type: string
          description: Street Address line2.
          minLength: 3
          maxLength: 20
          example: Main Road
        line3:
          type: string
          description: Street Address line3.
          minLength: 3
          maxLength: 20
          example: Snake Hill Ave
        type:
          type: string
          description: Denotes the type of address. (For example, home or work)
          example: 'work'
          minLength: 3
          maxLength: 20
      title: Address
    Email:
      type: object
      properties:
        type:
          type: string
          description: Denotes the  type of email (For example, home)
          minLength: 1
          maxLength: 10
          example: home
        value:
          type: string
          description: Denotes email address.
          minLength: 5
          maxLength: 100
          example: John.Doe@mail.com
      title: Email
    UserName:
      type: object
      required:
        - firstName
        - lastName
      properties:
        firstName:
          type: string
          example: John
          minLength: 1
          maxLength: 100
          description: Denotes the first name of the user.
        lastName:
          type: string
          description: Denotes the last name of the user.
          minLength: 1
          maxLength: 100
          example: Doe
      title: Username
    UpdateUserProfile:
      title: UpdateUserProfile
      type: object
      description: The request object for updating a enrolled user onto Carbon Calculator Experience Service.
      required:
        - name
        - locale
      properties:
        name:
          $ref: '#/components/schemas/UserName'
        billingAddress:
          $ref: '#/components/schemas/Address'
        locale:
          type: string
          description: Updating User locale which is registered with issuer.
          minLength: 1
          maxLength: 100
          example: en-US
    IssuerProfile:
      title: IssuerProfile
      type: object
      description: Information about an Issuer as available on the server.
      required:
        - clientId
        - supportedAccountRange
        - status
      properties:
        clientId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[\w\d\-\_]{1,200}'
          description: Unique Issuer identifier from the Mastercard Developer Portal.
          example: fjl2fxzsYl1OpvxkBItC9nVw1PSQc_b-eQMcmQFg011ab4b5
        customerId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[\w\d]{1,200}'
          description: >-
            Unique Issuer identifier assigned by Mastercard which remains the same
            across all Mastercard systems.
          example: customerid1
        supportedAccountRange:
          type: string
          pattern: '^\s*[0-9]{4,8}(\s*,\s*[0-9]{4,8})*\s*$'
          description: >-
            Comma separated account range must be between 4 and 8 supported by
            an Issuer.
          example: '534403,518145,518152,5403,5424'
        status:
          type: string
          minLength: 6
          maxLength: 9
          description: >-
            Status of an Issuer on the server. Possible values are Active and
            Suspended.
          example: ACTIVE
        privacyNoticeURL:
          type: string
          description: Privacy Notice URL.
          example: "https://www.issuer.privacy-policy-url.html"
        termsAndConditionURL:
          type: string
          description: Terms and conditions URL for the given user.
          example: "https://www.issuer.term-and-conditions.html"
        optOutURL:
          type: string
          description: Opt out URL for the given user.
          example: "https://www.issuer.opt-out-url.html"
        preferredTheme:
          $ref : '#/components/schemas/PreferredTheme'

    IssuerConfiguration:
      title: IssuerConfiguration
      type: object
      description: Configuration details for an Issuer.
      properties:
        supportedAccountRange:
          type: string
          pattern: ^\s*[0-9]{4,8}(\s*,\s*[0-9]{4,8})*\s*$
          description: >-
            Comma separated account range must be between 4 and 8 supported by
            an Issuer.
          example: '534403,518145,518152,5403,5424'
        privacyNoticeURL:
          type: string
          description: Privacy Notice URL.
          example: "https://www.issuer.privacy-policy-url.html"
        termsAndConditionURL:
          type: string
          description: >-
            Terms and conditions URL for the given user.
          example: "https://www.issuer.term-and-conditions.html"
        optOutURL:
          type: string
          description: >-
            Opt out URL for the given user.
          example: "https://www.issuer.opt-out-url.html"
        preferredTheme:
          $ref: '#/components/schemas/PreferredTheme'
    CountryName:
      type: string
      description: ISO 3166 country short name
      pattern: '^[a-zA-Z\s\\(\\),\\.]+$'
      minLength: 3
      maxLength: 50
      example: Brazil
    UserReference:
      title: UserReference
      type: object
      description: Successful user enrollment response
      required:
        - cardNumberLastFourDigits
        - status
        - userid
      properties:
        userid:
          $ref: '#/components/schemas/UserID'
        cardNumberLastFourDigits:
          type: string
          minLength: 4
          maxLength: 4
          pattern: '^\d{4}$'
          description: >-
            Last 4 digits of a full payment card number which were provided as
            enrollment request.
          example: '4363'
        status:
          type: string
          minLength: 6
          maxLength: 7
          description: >-
            Status of a Payment Card on Carbon Calculator Experience API.
            Possible values are Active and Deleted.
          example: ACTIVE
    UserID:
      type: string
      minLength: 36
      maxLength: 36
      pattern: '^[0-9A-Fa-f-]{36}'
      description: >-
        Unique identifier for a user enrolled in the Carbon Calculator Experience platform.
      example: f5d88571-ac15-465a-a0d8-1ad1327b9a06
    Lang:
      type: string
      description: Language for the issuer.
      example: en-US
    Dashboard:
      type: object
      required:
        - url
        - expiryInMillis
      properties:
        url:
          type: string
          description: This is the URL that needs to be rendered in web view with language code send by the issuer appended at the end of the URL.
          minLength: 1
          maxLength: 5000
          example: >-
            https://ppctwebview.b221.net/home/?auth_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c&lang=en-US
        expiryInMillis:
          type: string
          description: Denotes expiry limit for the URL.
          minLength: 1
          maxLength: 10
          example: '300000'
    AggregateCarbonScore:
      type: object
      required:
        - carbonEmissionInGrams
        - aggregateDate
      properties:
        carbonEmissionInGrams:
          type: string
          description: An aggregate value of CO2 emission in grams.
          minLength: 1
          maxLength: 10
          example: '3245'
        aggregateDate:
          type: string
          description: Denotes aggregate duration.
          minLength: 1
          maxLength: 20
          example: november-2020
    ErrorWrapper:
      title: ErrorWrapper
      type: object
      description: The error response object gets returned in case of error.
      required:
        - Errors
      properties:
        Errors:
          $ref: '#/components/schemas/Errors'
    Errors:
      title: Errors
      type: object
      description: Error object which contains a list of error objects.
      required:
        - Error
      properties:
        Error:
          type: array
          items:
            $ref: '#/components/schemas/Error'
    Error:
      title: Error
      type: object
      description: Error object which contains details about a single error.
      required:
        - Source
        - ReasonCode
        - Description
        - Recoverable
      properties:
        Source:
          type: string
          description: >-
            The application name that generated this error. If an error is
            generated and returned by the gateway, then this field will have
            value as `Gateway`. Other possible values are `CARBON CALCULATOR`,
            `DONATE`, `CARBON_CALCULATOR_EXPERIENCE` or `PRICELESS PLANET`.
          minLength: 1
          maxLength: 100
          example: CARBON_CALCULATOR_EXPERIENCE
        ReasonCode:
          type: string
          description: >-
            A unique constant identifying the error case encountered during
            request processing.
          minLength: 1
          maxLength: 100
          example: INVALID_REQUEST_PARAMETER
        Description:
          type: string
          description: Short description of the `ReasonCode` field.
          minLength: 10
          maxLength: 1000
          example: >-
            One of the request parameters is invalid, try again with correct
            request.
        Recoverable:
          type: boolean
          description: >-
            Indicates whether this error will always be returned for this
            request, or retrying could change the outcome.
          example: false
        Details:
          type: string
          description: >-
            (Optional) Where appropriate, indicates detailed information about
            data received and calculated during the request processing, to help
            the user with diagnosing errors.
          minLength: 0
          maxLength: 5000
          example: email must not be null.
    PreferredTheme:
      type: object
      additionalProperties:
        type: string
      description: >-
        Color hex code to set preferred colors for webview.
      example: {
        "backgroundColor": "#FFFFFF",
        "widgetBackgroundColor": "#FFFFFF",
        "fontColor": "#000000",
        "buttonColor": "#999999",
        "barGraphColor": "#111111",
        "buttonTextColor": "#FFFFFF",
        "titleFontType":"Mark Offc For MC",
        "titleFontSize": "28px",
        "subTitleFontType":"Mark Offc For MC",
        "subTitleFontSize":"20px",
        "paragraphFontType":"Mark Offc For MC",
        "paragraphFontSize":"15px",
        "buttonTextFontType":"Mark Offc For MC",
        "buttonTextFontSize":"15px",
        "linkFontType":"Mark Offc For MC",
        "linkFontSize":"15px"
      }
    EncryptedPayload:
      title: EncryptedPayload
      type: object
      description: The request object for securely transfering sensitive information from client to server.
      required:
        - encryptedData
        - encryptedKey
        - oaepHashingAlgorithm
        - publicKeyFingerprint
        - iv
      properties:
        encryptedData:
          type: string
          minLength: 128
          maxLength: 54000
          description: 'Hex encoded encrypted data, encrypted by the ephemeral AES key using CBC (IV as provided in ''iv'', or zero if none provided) and PKCS#7 padding. The JSON object being encrypted will be defined in the context of the API call.'
          example: 'bb42e8e44b0e0536804b731df966d242a8182c2f21f5772a161dca9685ee76f07d23e40fa8fb9938169458e0ca659f477291f0153754687da2c4570d9d2f8bde'
        encryptedKey:
          type: string
          minLength: 512
          maxLength: 512
          description: 'One-time use hex encoded 256-bit AES key encrypted by the Mastercard public key (as identified by ''publicKeyFingerprint'') using the OAEP or RSA Encryption Standard PKCS#1 v1.5 (depending on the value of ''oaepHashingAlgorithm''.'
          example: ''
        oaepHashingAlgorithm:
          type: string
          minLength: 6
          maxLength: 6
          description: 'The hashing algorithm used with the OAEP scheme. Must be one of SHA256 & SHA512.'
          example: 'SHA256'
        publicKeyFingerprint:
          type: string
          minLength: 64
          maxLength: 1000
          description: 'The public key fingerprint of the key used by the RSA-OAEP encryption scheme.'
          example: '31d5808a1994dd6c142afe2866274df756bf685970106ea5b2a73d587104f17e'
        iv:
          type: string
          minLength: 32
          maxLength: 32
          description: 'The hex encoded initialization vector used when encrypting data using the one-time use AES key. Must be exactly 16 bytes if provided (32 character hex string) to match the block size.'
          example: '6d3a83b3fb0db252b0bd9e3bbb7f2ca2'
      example:
        encryptedData: 'bb42e8e44b0e0536804b731df966d242a8182c2f21f5772a161dca9685ee76f07d23e40fa8fb9938169458e0ca659f477291f0153754687da2c4570d9d2f8bde'
        encryptedKey: ''
        oaepHashingAlgorithm: 'SHA256'
        publicKeyFingerprint: '31d5808a1994dd6c142afe2866274df756bf685970106ea5b2a73d587104f17e'
        iv: '6d3a83b3fb0db252b0bd9e3bbb7f2ca2'
